name: Trigger Argo Workflow on Push

on:
  push:
    branches: ['*']

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with Maven
        run: mvn clean package -DskipTests
      
      - name: Test with Maven
        run: mvn test
      
      - name: Trigger Argo Workflow
        run: |
          echo "✅ Build and test completed for commit: ${{ github.sha }}"
          echo "✅ Branch: ${{ github.ref_name }}"
          echo "✅ Argo Workflow would be triggered here"
          echo ""
          echo "To trigger Argo locally, run:"
          echo "argo submit -n argo --from workflowtemplate/hello-springboot-ci"
