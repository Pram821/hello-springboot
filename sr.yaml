# -------------------------------------------
# Istio Service Mesh Configuration
# -------------------------------------------

# Gateway - Entry point for external traffic
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: hello-springboot-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "hello-springboot.local"
        - "*.hello-springboot.local"

---

# VirtualService - Traffic routing rules
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: hello-springboot-vs
  namespace: default
spec:
  hosts:
    - "hello-springboot.local"
  gateways:
    - hello-springboot-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: hello-springboot
            port:
              number: 8080
          weight: 100
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure
      timeout: 10s

---

# DestinationRule - Load balancing & circuit breaker
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: hello-springboot-dr
  namespace: default
spec:
  host: hello-springboot
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        h2UpgradePolicy: DEFAULT
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    loadBalancer:
      simple: ROUND_ROBIN
  subsets:
    - name: stable
      labels:
        version: stable
    - name: canary
      labels:
        version: canary

---

# PeerAuthentication - mTLS enforcement
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: hello-springboot-mtls
  namespace: default
spec:
  selector:
    matchLabels:
      app: hello-springboot
  mtls:
    mode: STRICT

---

# AuthorizationPolicy - Access control
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: hello-springboot-authz
  namespace: default
spec:
  selector:
    matchLabels:
      app: hello-springboot
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - default
              - istio-system
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "DELETE"]
            ports: ["8080"]

---

# RequestAuthentication - JWT validation (optional, configure issuer)
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: hello-springboot-jwt
  namespace: default
spec:
  selector:
    matchLabels:
      app: hello-springboot
  jwtRules: []
  # Uncomment and configure for JWT auth:
  # jwtRules:
  #   - issuer: "https://accounts.google.com"
  #     jwksUri: "https://www.googleapis.com/oauth2/v3/certs"

---

# ServiceEntry - Allow egress to external services
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: hello-springboot-external
  namespace: default
spec:
  hosts:
    - hub.docker.com
    - api.github.com
  location: MESH_EXTERNAL
  ports:
    - number: 443
      name: https
      protocol: TLS
  resolution: DNS

---

# Sidecar - Limit sidecar proxy scope
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: hello-springboot-sidecar
  namespace: default
spec:
  workloadSelector:
    labels:
      app: hello-springboot
  egress:
    - hosts:
        - "./*"
        - "istio-system/*"
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
