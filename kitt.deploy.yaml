# -------------------------------------------
# GitHub Actions CI/CD Pipeline
# -------------------------------------------
github_actions:
  name: CI/CD Pipeline
  on:
    push:
      branches: ['*']
    pull_request:
      branches: [main]

  env:
    IMAGE_NAME: pram821/hello-springboot

  jobs:
    # -----------------------------------------
    # Stage 1: Build
    # -----------------------------------------
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: temurin
            cache: maven
        - run: mvn clean package -DskipTests
        - uses: actions/upload-artifact@v4
          with:
            name: jar
            path: target/*.jar
            retention-days: 1

    # -----------------------------------------
    # Stage 2: Test
    # -----------------------------------------
    test:
      runs-on: ubuntu-latest
      needs: build
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: temurin
            cache: maven
        - run: mvn test
        - uses: dorny/test-reporter@v1
          if: always()
          with:
            name: Test Results
            path: target/surefire-reports/TEST-*.xml
            reporter: java-junit

    # -----------------------------------------
    # Stage 3: Docker Build & Push
    # -----------------------------------------
    publish:
      runs-on: ubuntu-latest
      needs: test
      if: github.ref == 'refs/heads/main'
      steps:
        - uses: actions/checkout@v4
        - uses: actions/download-artifact@v4
          with:
            name: jar
            path: target/
        - uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        - name: Build and push
          run: |
            IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
            docker build -t $IMAGE_NAME:$IMAGE_TAG .
            docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
            docker push $IMAGE_NAME:$IMAGE_TAG
            docker push $IMAGE_NAME:latest

    # -----------------------------------------
    # Stage 4: Deploy to Kubernetes
    # -----------------------------------------
    deploy:
      runs-on: ubuntu-latest
      needs: publish
      if: github.ref == 'refs/heads/main'
      environment: production
      steps:
        - uses: azure/setup-kubectl@v3
        - uses: azure/k8s-set-context@v3
          with:
            kubeconfig: ${{ secrets.KUBECONFIG }}
        - name: Deploy
          run: |
            IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
            cat <<EOF | kubectl apply -f -
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: hello-springboot
              labels:
                app: hello-springboot
                app.kubernetes.io/name: hello-springboot
                app.kubernetes.io/managed-by: argocd
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: hello-springboot
              strategy:
                type: RollingUpdate
                rollingUpdate:
                  maxSurge: 1
                  maxUnavailable: 0
              template:
                metadata:
                  labels:
                    app: hello-springboot
                spec:
                  containers:
                    - name: hello-springboot
                      image: pram821/hello-springboot:$IMAGE_TAG
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 8080
                      readinessProbe:
                        httpGet:
                          path: /
                          port: 8080
                        initialDelaySeconds: 15
                        periodSeconds: 5
                      livenessProbe:
                        httpGet:
                          path: /
                          port: 8080
                        initialDelaySeconds: 30
                        periodSeconds: 10
                      resources:
                        requests:
                          memory: "256Mi"
                          cpu: "250m"
                        limits:
                          memory: "512Mi"
                          cpu: "500m"
            EOF
            cat <<EOF | kubectl apply -f -
            apiVersion: v1
            kind: Service
            metadata:
              name: hello-springboot
            spec:
              type: NodePort
              selector:
                app: hello-springboot
              ports:
                - port: 8080
                  targetPort: 8080
            EOF
            kubectl rollout status deployment/hello-springboot --timeout=120s

# -------------------------------------------
# ArgoCD - Install & Server Deployment
# -------------------------------------------
argocd_install:
  # Install ArgoCD into minikube:
  #   kubectl create namespace argocd
  #   kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml --server-side --force-conflicts
  #   kubectl patch svc argocd-server -n argocd -p '{"spec": {"type": "NodePort"}}'
  #
  # Get admin password:
  #   kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d
  #
  # Access ArgoCD UI:
  #   minikube service argocd-server -n argocd

# -------------------------------------------
# Argo CD - GitOps Configuration
# -------------------------------------------
argocd:
  project:
    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: hello-springboot
      namespace: argocd
    spec:
      description: Hello Spring Boot application project
      destinations:
        - namespace: default
          server: https://kubernetes.default.svc
      sourceRepos:
        - https://github.com/pram821/hello-springboot.git
      namespaceResourceWhitelist:
        - group: ''
          kind: Service
        - group: apps
          kind: Deployment
      roles:
        - name: ci-role
          description: Role for CI/CD pipeline
          policies:
            - p, proj:hello-springboot:ci-role, applications, sync, hello-springboot/*, allow
            - p, proj:hello-springboot:ci-role, applications, get, hello-springboot/*, allow

  application:
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: hello-springboot
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: hello-springboot
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: hello-springboot
      source:
        repoURL: https://github.com/pram821/hello-springboot.git
        targetRevision: main
        path: .
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m

# -------------------------------------------
# OPA Gatekeeper - Policy Enforcement
# -------------------------------------------
gatekeeper:
  # Policy 1: Require resource limits on all containers
  require_resource_limits:
    template:
      apiVersion: templates.gatekeeper.sh/v1
      kind: ConstraintTemplate
      metadata:
        name: k8srequiredresources
      spec:
        crd:
          spec:
            names:
              kind: K8sRequiredResources
        targets:
          - target: admission.k8s.gatekeeper.sh
            rego: |
              package k8srequiredresources
              violation[{"msg": msg}] {
                container := input.review.object.spec.template.spec.containers[_]
                not container.resources.limits
                msg := sprintf("Container '%v' must have resource limits", [container.name])
              }
    constraint:
      apiVersion: constraints.gatekeeper.sh/v1beta1
      kind: K8sRequiredResources
      metadata:
        name: require-resource-limits
      spec:
        match:
          kinds:
            - apiGroups: ["apps"]
              kinds: ["Deployment"]
          namespaces: ["default"]

  # Policy 2: Block privileged containers
  block_privileged:
    template:
      apiVersion: templates.gatekeeper.sh/v1
      kind: ConstraintTemplate
      metadata:
        name: k8sblockprivileged
      spec:
        crd:
          spec:
            names:
              kind: K8sBlockPrivileged
        targets:
          - target: admission.k8s.gatekeeper.sh
            rego: |
              package k8sblockprivileged
              violation[{"msg": msg}] {
                container := input.review.object.spec.template.spec.containers[_]
                container.securityContext.privileged == true
                msg := sprintf("Privileged container '%v' is not allowed", [container.name])
              }
    constraint:
      apiVersion: constraints.gatekeeper.sh/v1beta1
      kind: K8sBlockPrivileged
      metadata:
        name: block-privileged-containers
      spec:
        match:
          kinds:
            - apiGroups: ["apps"]
              kinds: ["Deployment"]
          namespaces: ["default"]

  # Policy 3: Require 'app' label on deployments
  require_labels:
    template:
      apiVersion: templates.gatekeeper.sh/v1
      kind: ConstraintTemplate
      metadata:
        name: k8srequiredlabels
      spec:
        crd:
          spec:
            names:
              kind: K8sRequiredLabels
            validation:
              openAPIV3Schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      type: string
        targets:
          - target: admission.k8s.gatekeeper.sh
            rego: |
              package k8srequiredlabels
              violation[{"msg": msg}] {
                provided := {label | input.review.object.metadata.labels[label]}
                required := {label | label := input.parameters.labels[_]}
                missing := required - provided
                count(missing) > 0
                msg := sprintf("Missing required labels: %v", [missing])
              }
    constraint:
      apiVersion: constraints.gatekeeper.sh/v1beta1
      kind: K8sRequiredLabels
      metadata:
        name: require-app-label
      spec:
        match:
          kinds:
            - apiGroups: ["apps"]
              kinds: ["Deployment"]
          namespaces: ["default"]
        parameters:
          labels:
            - "app"

  # Policy 4: Only allow images from approved registries
  allowed_registries:
    template:
      apiVersion: templates.gatekeeper.sh/v1
      kind: ConstraintTemplate
      metadata:
        name: k8sallowedregistries
      spec:
        crd:
          spec:
            names:
              kind: K8sAllowedRegistries
            validation:
              openAPIV3Schema:
                type: object
                properties:
                  registries:
                    type: array
                    items:
                      type: string
        targets:
          - target: admission.k8s.gatekeeper.sh
            rego: |
              package k8sallowedregistries
              violation[{"msg": msg}] {
                container := input.review.object.spec.template.spec.containers[_]
                not startswith_any(container.image)
                msg := sprintf("Image '%v' is not from an allowed registry. Allowed: %v", [container.image, input.parameters.registries])
              }
              startswith_any(image) {
                registry := input.parameters.registries[_]
                startswith(image, registry)
              }
    constraint:
      apiVersion: constraints.gatekeeper.sh/v1beta1
      kind: K8sAllowedRegistries
      metadata:
        name: allowed-registries
      spec:
        match:
          kinds:
            - apiGroups: ["apps"]
              kinds: ["Deployment"]
          namespaces: ["default"]
        parameters:
          registries:
            - "pram821/"
            - "docker.io/pram821/"

# -------------------------------------------
# Argo Namespace & RBAC
# -------------------------------------------
argo_namespace:
  apiVersion: v1
  kind: Namespace
  metadata:
    name: argo

argo_rbac:
  apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: argo-default-admin
    namespace: argo
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: admin
  subjects:
    - kind: ServiceAccount
      name: default
      namespace: argo

# -------------------------------------------
# Argo Server - UI Configuration
# -------------------------------------------
argo_server:
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: argo-server
    namespace: argo
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: argo-server
    template:
      metadata:
        labels:
          app: argo-server
      spec:
        serviceAccountName: argo-server
        containers:
          - name: argo-server
            image: quay.io/argoproj/argocli:v3.5.5
            args:
              - server
              - --auth-mode
              - server
              - --secure=false
              - --access-control-allow-origin=*
            ports:
              - containerPort: 2746
                name: web
            readinessProbe:
              httpGet:
                path: /
                port: 2746
                scheme: HTTP
              initialDelaySeconds: 10

# -------------------------------------------
# Argo Events - EventBus for CI Pipeline
# -------------------------------------------
eventbus:
  apiVersion: argoproj.io/v1alpha1
  kind: EventBus
  metadata:
    name: default
    namespace: argo
  spec:
    nats:
      native:
        replicas: 1

# -------------------------------------------
# Argo Workflows - CI Pipeline
# -------------------------------------------
argo_workflows:
  workflow_template:
    apiVersion: argoproj.io/v1alpha1
    kind: WorkflowTemplate
    metadata:
      name: hello-springboot-ci
      namespace: argo
      labels:
        app: hello-springboot
    spec:
      entrypoint: ci-pipeline
      arguments:
        parameters:
          - name: repo-url
            value: https://github.com/Pram821/hello-springboot.git
          - name: branch
            value: main
          - name: image
            value: pram821/hello-springboot
      volumeClaimTemplates:
        - metadata:
            name: workspace
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 500Mi
      templates:
        - name: ci-pipeline
          steps:
            - - name: notify-start
                template: slack-notify
                arguments:
                  parameters:
                    - name: message
                      value: "🚀 *Pipeline Started*\n📦 Repo: {{workflow.parameters.repo-url}}\n🌿 Branch: {{workflow.parameters.branch}}\n🔗 Workflow: {{workflow.name}}\n📊 <http://localhost:2746/workflows/argo/{{workflow.name}}|View Pipeline Logs>"
            - - name: checkout
                template: checkout
            - - name: build
                template: build
            - - name: test
                template: test
            - - name: contract-test
                template: contract-test
            - - name: functional-test
                template: functional-test
            - - name: notify-build-done
                template: slack-notify
                arguments:
                  parameters:
                    - name: message
                      value: "✅ *Build & All Tests Passed*\n🔗 Workflow: {{workflow.name}}\n📊 <http://localhost:2746/workflows/argo/{{workflow.name}}|View Pipeline Logs>"
            - - name: get-tag
                template: get-tag
            - - name: docker-build-push
                template: docker-build-push
                arguments:
                  parameters:
                    - name: tag
                      value: "{{steps.get-tag.outputs.result}}"
            - - name: notify-deploying
                template: slack-notify
                arguments:
                  parameters:
                    - name: message
                      value: "🐳 *Docker Image Pushed* — Now Deploying...\n📦 Image: {{workflow.parameters.image}}:{{steps.get-tag.outputs.result}}\n📊 <http://localhost:2746/workflows/argo/{{workflow.name}}|View Pipeline Logs>"
            - - name: deploy
                template: deploy
                arguments:
                  parameters:
                    - name: tag
                      value: "{{steps.get-tag.outputs.result}}"
            - - name: performance-test
                template: performance-test
            - - name: notify-success
                template: slack-notify
                arguments:
                  parameters:
                    - name: message
                      value: "🎉 *Pipeline Complete!*\n✅ Unit, Contract, Functional & Performance Tests Passed\n📦 Image: {{workflow.parameters.image}}:{{steps.get-tag.outputs.result}}\n🌿 Branch: {{workflow.parameters.branch}}\n🔗 Workflow: {{workflow.name}}\n📊 <http://localhost:2746/workflows/argo/{{workflow.name}}|View Pipeline Logs>"

        - name: checkout
          container:
            image: alpine/git:latest
            command: [sh, -c]
            args:
              - |
                git clone --branch {{workflow.parameters.branch}} {{workflow.parameters.repo-url}} /workspace/src
            volumeMounts:
              - name: workspace
                mountPath: /workspace

        - name: build
          container:
            image: maven:3.9-eclipse-temurin-17
            command: [sh, -c]
            args:
              - cd /workspace/src && mvn clean package -DskipTests
            volumeMounts:
              - name: workspace
                mountPath: /workspace

        - name: test
          container:
            image: maven:3.9-eclipse-temurin-17
            command: [sh, -c]
            args:
              - cd /workspace/src && mvn test
            volumeMounts:
              - name: workspace
                mountPath: /workspace

        - name: contract-test
          container:
            image: maven:3.9-eclipse-temurin-17
            command: [sh, -c]
            args:
              - cd /workspace/src && mvn verify -pl persona -am -Pcontract-tests -DskipUnitTests=true
            volumeMounts:
              - name: workspace
                mountPath: /workspace

        - name: functional-test
          container:
            image: maven:3.9-eclipse-temurin-17
            command: [sh, -c]
            args:
              - cd /workspace/src && mvn verify -pl functional-tests -am -DskipUnitTests=true
            volumeMounts:
              - name: workspace
                mountPath: /workspace

        - name: performance-test
          container:
            image: maven:3.9-eclipse-temurin-17
            command: [sh, -c]
            args:
              - cd /workspace/src && mvn gatling:test -pl persona -am
            volumeMounts:
              - name: workspace
                mountPath: /workspace

        - name: get-tag
          container:
            image: alpine/git:latest
            command: [sh, -c]
            args:
              - cd /workspace/src && git rev-parse --short HEAD
            volumeMounts:
              - name: workspace
                mountPath: /workspace

        - name: docker-build-push
          inputs:
            parameters:
              - name: tag
          volumes:
            - name: docker-config
              secret:
                secretName: dockerhub-credentials
          container:
            image: gcr.io/kaniko-project/executor:latest
            args:
              - --dockerfile=/workspace/src/Dockerfile
              - --context=/workspace/src
              - --destination={{workflow.parameters.image}}:{{inputs.parameters.tag}}
              - --destination={{workflow.parameters.image}}:latest
            volumeMounts:
              - name: workspace
                mountPath: /workspace
              - name: docker-config
                mountPath: /kaniko/.docker

        - name: deploy
          inputs:
            parameters:
              - name: tag
          serviceAccountName: default
          container:
            image: bitnami/kubectl:latest
            command: [sh, -c]
            args:
              - |
                kubectl patch deployment hello-springboot -n default -p '{"spec":{"template":{"metadata":{"labels":{"app":"hello-springboot"}},"spec":{"containers":[{"name":"hello-springboot","image":"{{workflow.parameters.image}}:{{inputs.parameters.tag}}","resources":{"requests":{"memory":"256Mi","cpu":"250m"},"limits":{"memory":"512Mi","cpu":"500m"}}}]}}}}'
                kubectl rollout status deployment/hello-springboot -n default --timeout=120s

        - name: slack-notify
          inputs:
            parameters:
              - name: message
          container:
            image: curlimages/curl:latest
            command: [sh, -c]
            args:
              - |
                curl -s -X POST $(cat /secret/url) \
                  -H 'Content-Type: application/json' \
                  -d '{"text":"{{inputs.parameters.message}}"}'
            volumeMounts:
              - name: slack-secret
                mountPath: /secret
          volumes:
            - name: slack-secret
              secret:
                secretName: slack-webhook

  # Event Source - Listen for GitHub webhooks
  event_source:
    apiVersion: argoproj.io/v1alpha1
    kind: EventSource
    metadata:
      name: github-webhook
      namespace: argo
    spec:
      eventBusName: default
      service:
        ports:
          - port: 12000
            targetPort: 12000
      github:
        hello-springboot:
          repositories:
            - owner: Pram821
              names:
                - hello-springboot
          webhook:
            endpoint: /push
            port: "12000"
            method: POST
          events:
            - push
          apiToken:
            name: github-access
            key: token
          webhookSecret:
            name: github-access
            key: secret
          insecure: true

  # Sensor - Trigger workflow on push events
  sensor:
    apiVersion: argoproj.io/v1alpha1
    kind: Sensor
    metadata:
      name: github-sensor
      namespace: argo
    spec:
      eventBusName: default
      dependencies:
        - name: github-push
          eventSourceName: github-webhook
          eventName: hello-springboot
      triggers:
        - template:
            name: trigger-ci
            argoWorkflow:
              operation: submit
              source:
                resource:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Workflow
                  metadata:
                    generateName: hello-springboot-ci-
                    namespace: argo
                  spec:
                    workflowTemplateRef:
                      name: hello-springboot-ci
                    arguments:
                      parameters:
                        - name: branch
                          value: ""
              parameters:
                - src:
                    dependencyName: github-push
                    dataKey: body.ref
                  dest: spec.arguments.parameters.0.value
                  operation: append

