apiVersion: apps/v1
kind: Deployment
metadata:
  name: seller-center-frontend
  namespace: seller-center
spec:
  replicas: 2
  selector:
    matchLabels:
      app: seller-center-frontend
  template:
    metadata:
      labels:
        app: seller-center-frontend
    spec:
      containers:
        - name: frontend
          image: us-central1-docker.pkg.dev/hello-springboot-2026/seller-center/seller-center-frontend:v1
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: seller-center-frontend
  namespace: seller-center
spec:
  type: LoadBalancer
  selector:
    app: seller-center-frontend
  ports:
    - port: 80
      targetPort: 80
