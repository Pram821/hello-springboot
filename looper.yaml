pipeline:
  agent: any

  environment:
    DOCKER_REGISTRY: pram821
    IMAGE_NAME: hello-springboot
    DOCKER_IMAGE: pram821/hello-springboot

  tools:
    maven: Maven-3.9
    jdk: JDK-17

  stages:
    - stage: Checkout
      steps:
        - checkout: scm
        - script:
            shell: git rev-parse --short HEAD
            assign: IMAGE_TAG

    - stage: Build
      steps:
        - shell: mvn clean package -DskipTests
      post:
        success:
          - archiveArtifacts:
              artifacts: target/*.jar
              fingerprint: true

    - stage: Test
      steps:
        - shell: mvn test
      post:
        always:
          - junit:
              testResults: target/surefire-reports/*.xml
              allowEmptyResults: true

    - stage: Docker Build & Push
      steps:
        - withCredentials:
            credentialsId: dockerhub-credentials
            usernameVariable: DOCKER_USER
            passwordVariable: DOCKER_PASS
          commands:
            - shell: |
                echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
                docker build -t ${DOCKER_IMAGE}:${IMAGE_TAG} .
                docker tag ${DOCKER_IMAGE}:${IMAGE_TAG} ${DOCKER_IMAGE}:latest
                docker push ${DOCKER_IMAGE}:${IMAGE_TAG}
                docker push ${DOCKER_IMAGE}:latest
                docker logout

  post:
    success:
      - echo: "Build succeeded. Image: ${DOCKER_IMAGE}:${IMAGE_TAG}"
    failure:
      - echo: "Build failed at stage: ${STAGE_NAME}"
    always:
      - cleanWorkspace: true
