# MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/pramsqldb?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=Banklogin!3
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Actuator & Micrometer
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=hello-springboot

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=hello-springboot-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.topic.campaign-events=campaign-events

# GraphQL
spring.graphql.graphiql.enabled=true
spring.graphql.path=/graphql

# OpenTelemetry Tracing
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
otel.service.name=hello-springboot
otel.resource.attributes=service.name=hello-springboot,service.version=0.0.1-SNAPSHOT

# Dynatrace Metrics Export
management.dynatrace.metrics.export.enabled=false
management.dynatrace.metrics.export.uri=${DYNATRACE_URI:https://your-environment.live.dynatrace.com/api/v2/metrics/ingest}
management.dynatrace.metrics.export.api-token=${DYNATRACE_API_TOKEN:}
management.dynatrace.metrics.export.v2.default-dimensions.service=hello-springboot
management.dynatrace.metrics.export.v2.default-dimensions.environment=${DYNATRACE_ENV:dev}