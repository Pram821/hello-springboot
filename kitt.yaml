stages:
  - build
  - test
  - publish
  - deploy

variables:
  IMAGE_NAME: pram821/hello-springboot
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository

# -------------------------------------------
# Stage 1: Build
# -------------------------------------------
build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour

# -------------------------------------------
# Stage 2: Test
# -------------------------------------------
test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml

# -------------------------------------------
# Stage 3: Docker Build & Push
# -------------------------------------------
publish:
  stage: publish
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - export IMAGE_TAG=$(echo $CI_COMMIT_SHA | cut -c1-7)
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  only:
    - main

# -------------------------------------------
# Stage 4: Deploy to Kubernetes
# -------------------------------------------
deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  before_script:
    - export IMAGE_TAG=$(echo $CI_COMMIT_SHA | cut -c1-7)
  script:
    - sed -i "s|image: pram821/hello-springboot:.*|image: pram821/hello-springboot:$IMAGE_TAG|" k8s/deployment.yaml
    - kubectl apply -f k8s/deployment.yaml
    - kubectl apply -f k8s/service.yaml
    - kubectl rollout status deployment/hello-springboot --timeout=120s
  environment:
    name: production
  only:
    - main

# -------------------------------------------
# Kubernetes Manifests
# -------------------------------------------
kubernetes:
  deployment:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: hello-springboot
      labels:
        app: hello-springboot
        app.kubernetes.io/name: hello-springboot
        app.kubernetes.io/managed-by: argocd
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: hello-springboot
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      template:
        metadata:
          labels:
            app: hello-springboot
        spec:
          containers:
            - name: hello-springboot
              image: pram821/hello-springboot:latest
              imagePullPolicy: Always
              ports:
                - containerPort: 8080
              readinessProbe:
                httpGet:
                  path: /
                  port: 8080
                initialDelaySeconds: 15
                periodSeconds: 5
              livenessProbe:
                httpGet:
                  path: /
                  port: 8080
                initialDelaySeconds: 30
                periodSeconds: 10
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "250m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"

  service:
    apiVersion: v1
    kind: Service
    metadata:
      name: hello-springboot
    spec:
      type: NodePort
      selector:
        app: hello-springboot
      ports:
        - port: 8080
          targetPort: 8080
