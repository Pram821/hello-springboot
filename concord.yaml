# -------------------------------------------
# Argo CD - GitOps Configuration
# -------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hello-springboot
  namespace: argocd
spec:
  description: Hello Spring Boot application project
  destinations:
    - namespace: default
      server: https://kubernetes.default.svc
  sourceRepos:
    - https://github.com/pram821/hello-springboot.git
  namespaceResourceWhitelist:
    - group: ''
      kind: Service
    - group: apps
      kind: Deployment
  roles:
    - name: ci-role
      description: Role for CI/CD pipeline
      policies:
        - p, proj:hello-springboot:ci-role, applications, sync, hello-springboot/*, allow
        - p, proj:hello-springboot:ci-role, applications, get, hello-springboot/*, allow

---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-springboot
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: hello-springboot
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hello-springboot

  source:
    repoURL: https://github.com/pram821/hello-springboot.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m

---

# -------------------------------------------
# Temporal - Multi-Step Deployment Workflow
# -------------------------------------------
workflow:
  name: hello-springboot-deploy
  id_prefix: deploy-hello-springboot
  task_queue: hello-springboot-deployments
  execution_timeout: 30m
  run_timeout: 25m

  input:
    image_tag:
      type: string
      required: true
      description: Docker image tag to deploy
    environment:
      type: string
      required: true
      default: staging
      enum: [staging, production]
    skip_approval:
      type: boolean
      default: false
      description: Skip manual approval (for staging only)

  steps:
    - name: trigger-build
      activity: trigger_github_actions_build
      timeout: 15m
      input:
        workflow_file: ci-cd.yml
        ref: main
        image_tag: "{{ input.image_tag }}"
      retry:
        max_attempts: 2
        initial_interval: 30s
        backoff_coefficient: 2.0
      on_failure: abort

    - name: verify-image
      activity: verify_docker_image
      timeout: 2m
      input:
        image: "pram821/hello-springboot:{{ input.image_tag }}"
      retry:
        max_attempts: 3
        initial_interval: 10s
      on_failure: abort

    - name: deploy-staging
      activity: deploy_to_kubernetes
      timeout: 5m
      input:
        environment: staging
        image_tag: "{{ input.image_tag }}"
        manifest_path: k8s/deployment.yaml
        namespace: staging
      on_failure: rollback

    - name: smoke-test-staging
      activity: run_smoke_tests
      timeout: 3m
      input:
        target_url: "http://hello-springboot.staging.svc:8080"
        expected_status: 200
        expected_body_contains: "Hello, Spring Boot!"
        retry_count: 5
        retry_interval: 10s
      on_failure: rollback

    - name: approval-gate
      activity: wait_for_approval
      condition: "{{ input.environment == 'production' or not input.skip_approval }}"
      timeout: 24h
      input:
        approvers:
          - platform-team
          - tech-leads
        message: |
          Deployment approval required for hello-springboot
          Image: pram821/hello-springboot:{{ input.image_tag }}
          Environment: {{ input.environment }}
        notification_channels:
          - slack: "#deployments"
          - email: "platform-team@example.com"
      on_timeout: abort

    - name: deploy-production
      activity: deploy_to_kubernetes
      condition: "{{ input.environment == 'production' }}"
      timeout: 5m
      input:
        environment: production
        image_tag: "{{ input.image_tag }}"
        manifest_path: k8s/deployment.yaml
        namespace: default
      on_failure: rollback

    - name: smoke-test-production
      activity: run_smoke_tests
      condition: "{{ input.environment == 'production' }}"
      timeout: 3m
      input:
        target_url: "http://hello-springboot.default.svc:8080"
        expected_status: 200
        expected_body_contains: "Hello, Spring Boot!"
        retry_count: 5
        retry_interval: 10s
      on_failure: rollback

    - name: sync-argocd
      activity: argocd_sync
      timeout: 2m
      input:
        app_name: hello-springboot
        revision: main
        prune: true
      on_failure: warn

  rollback:
    steps:
      - name: rollback-deployment
        activity: rollback_kubernetes_deployment
        timeout: 3m
        input:
          deployment: hello-springboot
          namespace: "{{ steps.deploy-production.input.namespace || steps.deploy-staging.input.namespace }}"

      - name: notify-rollback
        activity: send_notification
        input:
          channel: slack
          target: "#deployments"
          message: |
            ROLLBACK executed for hello-springboot
            Image: pram821/hello-springboot:{{ input.image_tag }}
            Failed step: {{ failed_step.name }}
            Error: {{ failed_step.error }}

  on_complete:
    - activity: send_notification
      input:
        channel: slack
        target: "#deployments"
        message: |
          Deployment {{ workflow.status }} for hello-springboot
          Image tag: {{ input.image_tag }}
          Environment: {{ input.environment }}
          Duration: {{ workflow.duration }}

---

# -------------------------------------------
# Temporal - Activity Definitions
# -------------------------------------------
activities:
  trigger_github_actions_build:
    description: Triggers the CI/CD workflow in GitHub Actions via the REST API
    implementation: com.example.hello.temporal.GitHubActionsActivity
    method: triggerBuild
    config:
      github_api_url: https://api.github.com
      repo: pram821/hello-springboot
    timeout: 15m
    heartbeat_timeout: 30s

  verify_docker_image:
    description: Verifies the Docker image exists in Docker Hub registry
    implementation: com.example.hello.temporal.DockerRegistryActivity
    method: verifyImageExists
    config:
      registry_url: https://hub.docker.com/v2
      repository: pram821/hello-springboot
    timeout: 2m

  deploy_to_kubernetes:
    description: Applies K8s manifests with updated image tag using kubectl
    implementation: com.example.hello.temporal.KubernetesActivity
    method: deployManifest
    config:
      kubeconfig_secret: k8s-minikube-config
    timeout: 5m
    heartbeat_timeout: 15s

  run_smoke_tests:
    description: Sends HTTP requests to verify application is responding correctly
    implementation: com.example.hello.temporal.SmokeTestActivity
    method: runTests
    timeout: 3m

  wait_for_approval:
    description: Pauses workflow and waits for human approval signal
    implementation: com.example.hello.temporal.ApprovalActivity
    method: waitForApproval
    config:
      signal_name: approval-signal
    timeout: 24h

  argocd_sync:
    description: Triggers Argo CD application sync to force immediate reconciliation
    implementation: com.example.hello.temporal.ArgoCDActivity
    method: syncApplication
    config:
      argocd_server: argocd-server.argocd.svc:443
    timeout: 2m

  rollback_kubernetes_deployment:
    description: Executes kubectl rollout undo on the specified deployment
    implementation: com.example.hello.temporal.KubernetesActivity
    method: rollbackDeployment
    timeout: 3m

  send_notification:
    description: Sends deployment status notifications to configured channels
    implementation: com.example.hello.temporal.NotificationActivity
    method: sendNotification
    config:
      slack_webhook_secret: slack-webhook-url
    timeout: 30s
